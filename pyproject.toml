[project]
name = "ermis-voice"
version = "0.3.0a1"
description = "SDK Python da Ermis Voice API: crie sessões de voz e conduza a conversa pelo canal de controle."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ermis" }]
keywords = ["ermis", "voice", "voice-agent", "telephony", "twilio", "speech"]
classifiers = [
    "Operating System :: OS Independent",
    "Natural Language :: Portuguese (Brazilian)",
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/Ermisai/ermis-voice-sdk"
Documentation = "https://github.com/Ermisai/ermis-voice-sdk/blob/main/docs/api.md"
Issues = "https://github.com/Ermisai/ermis-voice-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff==0.8.4",
    # só para o teste do exemplo
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ermis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RET", "C4"]
ignore = ["E501"]
